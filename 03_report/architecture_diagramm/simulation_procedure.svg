<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="650" viewBox="0 0 1650 650" role="img" aria-labelledby="title desc">
  <title id="title">Simulation Procedure Diagram</title>
  <desc id="desc">Three-stage diagram explaining the multi-agent hidden-profile simulation procedure.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#1f3a8a"/>
    </marker>
    <marker id="arrow-pink" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#db2777"/>
    </marker>
    <marker id="arrow-gray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#222222"/>
    </marker>
    <style>
      .title { font-family: Georgia, "Times New Roman", serif; font-size: 21px; fill: #111111; }
      .title-bold { font-weight: 700; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 15px; fill: #111827; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 12px; fill: #374151; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #4b5563; }
      .stage-box { fill: #ffffff; stroke: #111111; stroke-width: 2; }
      .soft-blue { fill: #eef4ff; stroke: #1f3a8a; stroke-width: 2; }
      .soft-green { fill: #eef9f2; stroke: #15803d; stroke-width: 2; }
      .soft-pink { fill: #fff0f6; stroke: #db2777; stroke-width: 2; }
      .soft-orange { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
      .soft-gray { fill: #f8fafc; stroke: #475569; stroke-width: 2; }
      .dashed-blue { fill: #ffffff; stroke: #1f3a8a; stroke-width: 2.5; stroke-dasharray: 9 7; }
      .dashed-pink { fill: #fff7fb; stroke: #db2777; stroke-width: 2.5; stroke-dasharray: 9 7; }
      .agent-head { fill: #1f3a8a; }
      .agent-body { fill: #dbeafe; stroke: #1f3a8a; stroke-width: 1.5; }
      .tool-head { fill: #ea580c; }
      .tool-body { fill: #fed7aa; stroke: #ea580c; stroke-width: 1.5; }
      .memory { fill: #fff7fb; stroke: #db2777; stroke-width: 1.5; }
      .public { fill: #f0fdf4; stroke: #15803d; stroke-width: 1.5; }
      .arrow-blue { stroke: #1f3a8a; stroke-width: 2; fill: none; marker-end: url(#arrow-blue); }
      .arrow-pink { stroke: #db2777; stroke-width: 2; fill: none; marker-end: url(#arrow-pink); }
      .arrow-gray { stroke: #222222; stroke-width: 2.2; fill: none; marker-end: url(#arrow-gray); }
    </style>
  </defs>

  <rect x="0" y="0" width="1650" height="650" fill="#ffffff"/>

  <!-- Stage titles -->
  <text x="154" y="44" class="title"><tspan class="title-bold">Stage 1:</tspan> Setup and Inputs</text>
  <text x="737" y="44" class="title"><tspan class="title-bold">Stage 2:</tspan> Discussion Rounds</text>
  <text x="1288" y="44" class="title"><tspan class="title-bold">Stage 3:</tspan> Decision and Outputs</text>

  <!-- Stage frames -->
  <rect x="38" y="68" width="410" height="500" class="stage-box"/>
  <rect x="535" y="68" width="650" height="500" class="stage-box"/>
  <rect x="1250" y="68" width="360" height="500" class="stage-box"/>

  <!-- Stage 1 content -->
  <rect x="74" y="106" width="338" height="70" rx="4" class="soft-green"/>
  <text x="243" y="132" text-anchor="middle" class="label">Hidden-profile task</text>
  <text x="243" y="154" text-anchor="middle" class="small">Public candidate facts + hiring criteria</text>

  <rect x="78" y="216" width="92" height="112" class="dashed-blue"/>
  <rect x="199" y="216" width="92" height="112" class="dashed-blue"/>
  <rect x="320" y="216" width="92" height="112" class="dashed-blue"/>

  <!-- Agent icons stage 1 -->
  <g transform="translate(124 250)">
    <circle cx="0" cy="0" r="22" class="agent-head"/>
    <circle cx="-12" cy="1" r="8" fill="#ffffff"/>
    <circle cx="12" cy="1" r="8" fill="#ffffff"/>
    <circle cx="-8" cy="0" r="3" fill="#1f3a8a"/>
    <circle cx="8" cy="0" r="3" fill="#1f3a8a"/>
    <path d="M-9 10 Q0 17 9 10" fill="none" stroke="#ffffff" stroke-width="2"/>
    <rect x="-16" y="31" width="32" height="34" rx="5" class="agent-body"/>
    <text x="0" y="54" text-anchor="middle" class="tiny">LLM</text>
  </g>
  <g transform="translate(245 250)">
    <circle cx="0" cy="0" r="22" class="agent-head"/>
    <circle cx="-12" cy="1" r="8" fill="#ffffff"/>
    <circle cx="12" cy="1" r="8" fill="#ffffff"/>
    <circle cx="-8" cy="0" r="3" fill="#1f3a8a"/>
    <circle cx="8" cy="0" r="3" fill="#1f3a8a"/>
    <path d="M-9 10 Q0 17 9 10" fill="none" stroke="#ffffff" stroke-width="2"/>
    <rect x="-16" y="31" width="32" height="34" rx="5" class="agent-body"/>
    <text x="0" y="54" text-anchor="middle" class="tiny">LLM</text>
  </g>
  <g transform="translate(366 250)">
    <circle cx="0" cy="0" r="22" class="agent-head"/>
    <circle cx="-12" cy="1" r="8" fill="#ffffff"/>
    <circle cx="12" cy="1" r="8" fill="#ffffff"/>
    <circle cx="-8" cy="0" r="3" fill="#1f3a8a"/>
    <circle cx="8" cy="0" r="3" fill="#1f3a8a"/>
    <path d="M-9 10 Q0 17 9 10" fill="none" stroke="#ffffff" stroke-width="2"/>
    <rect x="-16" y="31" width="32" height="34" rx="5" class="agent-body"/>
    <text x="0" y="54" text-anchor="middle" class="tiny">LLM</text>
  </g>

  <text x="124" y="350" text-anchor="middle" class="small">Agent 1</text>
  <text x="124" y="370" text-anchor="middle" class="tiny">private notes</text>
  <text x="245" y="350" text-anchor="middle" class="small">Agent 2</text>
  <text x="245" y="370" text-anchor="middle" class="tiny">private notes</text>
  <text x="366" y="350" text-anchor="middle" class="small">Agent 3</text>
  <text x="366" y="370" text-anchor="middle" class="tiny">private notes</text>

  <rect x="94" y="414" width="298" height="78" rx="4" class="soft-pink"/>
  <text x="243" y="439" text-anchor="middle" class="label">Treatment only: markdown SMM</text>
  <text x="243" y="461" text-anchor="middle" class="small">initialized as structured private memory</text>
  <text x="243" y="481" text-anchor="middle" class="tiny">candidate status | coverage | positions | decision state</text>

  <!-- Arrow stage 1 to stage 2 -->
  <line x1="468" y1="318" x2="515" y2="318" class="arrow-gray"/>
  <text x="491" y="288" text-anchor="middle" class="label">Deploy into</text>
  <text x="491" y="309" text-anchor="middle" class="label">meeting</text>

  <!-- Stage 2 content -->
  <rect x="582" y="104" width="556" height="74" rx="4" class="dashed-pink"/>
  <text x="860" y="129" text-anchor="middle" class="label">ADK orchestration layer</text>
  <text x="860" y="151" text-anchor="middle" class="small">shuffle speaker order each round; run agents; check votes</text>

  <rect x="593" y="221" width="122" height="118" class="dashed-blue"/>
  <rect x="759" y="221" width="122" height="118" class="dashed-blue"/>
  <rect x="925" y="221" width="122" height="118" class="dashed-blue"/>
  <rect x="1083" y="230" width="74" height="84" class="soft-orange"/>

  <!-- Agents stage 2 -->
  <g transform="translate(654 255)">
    <circle cx="0" cy="0" r="21" class="agent-head"/>
    <circle cx="-11" cy="1" r="7" fill="#ffffff"/>
    <circle cx="11" cy="1" r="7" fill="#ffffff"/>
    <circle cx="-7" cy="0" r="2.7" fill="#1f3a8a"/>
    <circle cx="7" cy="0" r="2.7" fill="#1f3a8a"/>
    <path d="M-9 10 Q0 16 9 10" fill="none" stroke="#ffffff" stroke-width="2"/>
    <rect x="-16" y="30" width="32" height="33" rx="5" class="agent-body"/>
    <text x="0" y="52" text-anchor="middle" class="tiny">LLM</text>
  </g>
  <g transform="translate(820 255)">
    <circle cx="0" cy="0" r="21" class="agent-head"/>
    <circle cx="-11" cy="1" r="7" fill="#ffffff"/>
    <circle cx="11" cy="1" r="7" fill="#ffffff"/>
    <circle cx="-7" cy="0" r="2.7" fill="#1f3a8a"/>
    <circle cx="7" cy="0" r="2.7" fill="#1f3a8a"/>
    <path d="M-9 10 Q0 16 9 10" fill="none" stroke="#ffffff" stroke-width="2"/>
    <rect x="-16" y="30" width="32" height="33" rx="5" class="agent-body"/>
    <text x="0" y="52" text-anchor="middle" class="tiny">LLM</text>
  </g>
  <g transform="translate(986 255)">
    <circle cx="0" cy="0" r="21" class="agent-head"/>
    <circle cx="-11" cy="1" r="7" fill="#ffffff"/>
    <circle cx="11" cy="1" r="7" fill="#ffffff"/>
    <circle cx="-7" cy="0" r="2.7" fill="#1f3a8a"/>
    <circle cx="7" cy="0" r="2.7" fill="#1f3a8a"/>
    <path d="M-9 10 Q0 16 9 10" fill="none" stroke="#ffffff" stroke-width="2"/>
    <rect x="-16" y="30" width="32" height="33" rx="5" class="agent-body"/>
    <text x="0" y="52" text-anchor="middle" class="tiny">LLM</text>
  </g>
  <g transform="translate(1120 258)">
    <circle cx="0" cy="0" r="18" class="tool-head"/>
    <circle cx="-9" cy="0" r="6" fill="#ffffff"/>
    <circle cx="9" cy="0" r="6" fill="#ffffff"/>
    <circle cx="-6" cy="0" r="2.2" fill="#ea580c"/>
    <circle cx="6" cy="0" r="2.2" fill="#ea580c"/>
    <path d="M-7 8 Q0 13 7 8" fill="none" stroke="#ffffff" stroke-width="2"/>
    <rect x="-14" y="27" width="28" height="28" rx="5" class="tool-body"/>
    <text x="0" y="46" text-anchor="middle" class="tiny">Q</text>
  </g>

  <text x="654" y="363" text-anchor="middle" class="small">Agent 1</text>
  <text x="820" y="363" text-anchor="middle" class="small">Agent 2</text>
  <text x="986" y="363" text-anchor="middle" class="small">Agent 3</text>
  <text x="1120" y="335" text-anchor="middle" class="tiny">tool</text>
  <text x="1120" y="351" text-anchor="middle" class="tiny">answer</text>

  <path d="M660 205 C710 182, 775 182, 813 207" class="arrow-blue"/>
  <text x="737" y="190" text-anchor="middle" class="tiny" fill="#1f3a8a">randomized speaker order</text>
  <path d="M1000 221 C1048 206, 1087 211, 1111 232" class="arrow-blue"/>
  <text x="1061" y="206" text-anchor="middle" class="tiny" fill="#1f3a8a">targeted question</text>
  <path d="M1082 292 C1035 330, 1000 333, 968 317" class="arrow-blue"/>
  <text x="1043" y="343" text-anchor="middle" class="tiny" fill="#1f3a8a">public answer</text>

  <rect x="616" y="407" width="190" height="90" rx="4" class="public"/>
  <text x="711" y="432" text-anchor="middle" class="label">Public history</text>
  <text x="711" y="454" text-anchor="middle" class="small">messages + tool Q&amp;A</text>
  <text x="711" y="475" text-anchor="middle" class="tiny">stored in chat.md</text>

  <rect x="835" y="407" width="190" height="90" rx="4" class="memory"/>
  <text x="930" y="432" text-anchor="middle" class="label">Parallel SMM update</text>
  <text x="930" y="454" text-anchor="middle" class="small">after each speaker turn</text>
  <text x="930" y="475" text-anchor="middle" class="tiny">updates private markdown memories</text>

  <polygon points="1095,408 1154,452 1095,496 1036,452" class="soft-gray"/>
  <text x="1095" y="445" text-anchor="middle" class="small">Vote</text>
  <text x="1095" y="463" text-anchor="middle" class="small">checker</text>

  <path d="M654 339 L686 398" class="arrow-blue"/>
  <path d="M820 339 L752 398" class="arrow-blue"/>
  <path d="M986 339 L951 398" class="arrow-pink"/>
  <path d="M806 452 L825 452" class="arrow-pink"/>
  <path d="M1025 452 L1032 452" class="arrow-gray"/>
  <path d="M1095 408 C1110 365, 1074 337, 1034 316" class="arrow-gray"/>
  <text x="1138" y="390" class="tiny">repeat until</text>
  <text x="1138" y="406" class="tiny">decision or round 5</text>

  <text x="930" y="521" text-anchor="middle" class="tiny" fill="#db2777">Low/moderate/high change only what history is visible in prompts</text>
  <text x="930" y="541" text-anchor="middle" class="tiny" fill="#db2777">High can include stored model thoughts in prompt history, not in chat.md</text>

  <!-- Arrow stage 2 to stage 3 -->
  <line x1="1204" y1="318" x2="1230" y2="318" class="arrow-gray"/>
  <text x="1217" y="289" text-anchor="middle" class="label">End</text>
  <text x="1217" y="309" text-anchor="middle" class="label">run</text>

  <!-- Stage 3 content -->
  <rect x="1282" y="110" width="296" height="98" rx="4" class="soft-blue"/>
  <text x="1430" y="137" text-anchor="middle" class="label">Final hiring recommendation</text>
  <text x="1430" y="161" text-anchor="middle" class="small">consensus after round 2+</text>
  <text x="1430" y="183" text-anchor="middle" class="small">or majority/no-majority at round 5</text>

  <rect x="1282" y="246" width="296" height="198" rx="4" class="soft-gray"/>
  <text x="1430" y="272" text-anchor="middle" class="label">Archived run artifacts</text>
  <text x="1312" y="306" class="small">1. chat.md: public transcript</text>
  <text x="1312" y="335" class="small">2. metadata.json: metrics + votes</text>
  <text x="1312" y="364" class="small">3. session.log: structured trace</text>
  <text x="1312" y="393" class="small">4. memory .md files: treatment SMM</text>
  <text x="1312" y="422" class="small">5. processed CSV for analysis</text>

  <rect x="1308" y="482" width="244" height="44" rx="4" class="soft-green"/>
  <text x="1430" y="509" text-anchor="middle" class="small">Evaluate quality, efficiency, consistency</text>
</svg>
